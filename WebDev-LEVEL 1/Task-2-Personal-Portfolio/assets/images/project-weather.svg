  <rect x="65" y="95" width="380" height="305" rx="12" fill="#13243d" stroke="#1f3d68" stroke-width="1"/>

  <text x="90" y="130" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">📍 CURRENT WEATHER</text>
  <text x="90" y="160" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">Pune, Maharashtra</text>
  <text x="90" y="180" fill="#94a3b8" font-family="sans-serif" font-size="12">Sunday, 10:30 AM • Partly Sunny</text>

  <g transform="translate(90, 200)">
    <text x="0" y="75" fill="#ffffff" font-family="sans-serif" font-size="64" font-weight="900">28°<tspan font-size="28" fill="#38bdf8">C</tspan></text>

    <circle cx="210" cy="40" r="32" fill="url(#sunGrad)"/>

    <path d="M 180 62 C 170 62 162 54 164 44 C 166 32 178 26 190 28 C 196 18 212 16 222 24 C 232 20 245 28 244 38 C 252 40 256 50 250 58 C 246 62 240 62 180 62 Z" fill="#e2e8f0" opacity="0.95"/>
  </g>

  <g transform="translate(90, 310)">

    <rect x="0" y="0" width="75" height="65" rx="8" fill="#0d1b30"/>
    <text x="10" y="22" fill="#64748b" font-family="sans-serif" font-size="10">HUMIDITY</text>
    <text x="10" y="46" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="700">62%</text>

    <rect x="85" y="0" width="75" height="65" rx="8" fill="#0d1b30"/>
    <text x="95" y="22" fill="#64748b" font-family="sans-serif" font-size="10">WIND</text>
    <text x="95" y="46" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="700">14 km/h</text>

    <rect x="170" y="0" width="75" height="65" rx="8" fill="#0d1b30"/>
    <text x="180" y="22" fill="#64748b" font-family="sans-serif" font-size="10">UV INDEX</text>
    <text x="180" y="46" fill="#f59e0b" font-family="sans-serif" font-size="15" font-weight="700">5.4 Mod</text>

    <rect x="255" y="0" width="75" height="65" rx="8" fill="#0d1b30"/>
    <text x="265" y="22" fill="#64748b" font-family="sans-serif" font-size="10">PRESSURE</text>
    <text x="265" y="46" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="700">1013 hPa</text>
  </g>

  <rect x="465" y="95" width="270" height="305" rx="12" fill="#13243d" stroke="#1f3d68" stroke-width="1"/>
  <text x="485" y="128" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">5-DAY FORECAST</text>

