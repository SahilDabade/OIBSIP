<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="weatherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="50%" stop-color="#14243b"/>
      <stop offset="100%" stop-color="#1b3152"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#weatherBg)"/>

  <circle cx="240" cy="110" r="140" fill="#38bdf8" opacity="0.08"/>
  <circle cx="600" cy="280" r="150" fill="#6366f1" opacity="0.08"/>

  <rect x="40" y="30" width="720" height="390" rx="14" fill="#0f1d33" stroke="#1e355b" stroke-width="1.5"/>

  <path d="M 40 44 A 14 14 0 0 1 54 30 L 746 30 A 14 14 0 0 1 760 44 L 760 76 L 40 76 Z" fill="#0c182c"/>
  <circle cx="65" cy="53" r="5" fill="#ef4444"/>
  <circle cx="80" cy="53" r="5" fill="#f59e0b"/>
  <circle cx="95" cy="53" r="5" fill="#10b981"/>

  <rect x="250" y="42" width="300" height="24" rx="12" fill="#182740"/>
