    <text x="12" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Tue</text>
    <text x="70" y="26" fill="#38bdf8" font-size="16">⛅</text>
    <text x="110" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11">Partly Cloud</text>
    <text x="195" y="26" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">28° / 19°</text>
  </g>

  <g transform="translate(485, 245)">
    <rect width="230" height="42" rx="6" fill="#0f1b2e"/>
    <text x="12" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Wed</text>
    <text x="70" y="26" fill="#60a5fa" font-size="16">🌧️</text>
    <text x="110" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11">Light Rain</text>
    <text x="195" y="26" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">26° / 18°</text>
  </g>

  <g transform="translate(485, 295)">
    <rect width="230" height="42" rx="6" fill="#0f1b2e"/>
    <text x="12" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Thu</text>
    <text x="70" y="26" fill="#f59e0b" font-size="16">🌤️</text>
    <text x="110" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11">Mostly Sunny</text>
    <text x="195" y="26" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">29° / 20°</text>
  </g>

  <g transform="translate(485, 345)">
    <rect width="230" height="42" rx="6" fill="#0f1b2e"/>
    <text x="12" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Fri</text>
    <text x="70" y="26" fill="#f59e0b" font-size="16">☀️</text>
    <text x="110" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11">Sunny</text>
    <text x="195" y="26" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">31° / 21°</text>
  </g>
