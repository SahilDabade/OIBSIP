    <text x="70" y="26" fill="#f59e0b" font-size="16">☀️</text>
    <text x="110" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11">Clear Sky</text>
    <text x="195" y="26" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">30° / 20°</text>
  </g>

  <g transform="translate(485, 195)">
