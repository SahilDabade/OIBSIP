  <text x="455" y="136" fill="#e2e8f0" font-family="sans-serif" font-size="12">Alex, optimize this quicksort routine and</text>
  <text x="455" y="152" fill="#e2e8f0" font-family="sans-serif" font-size="12">explain the recursive partition step.</text>

  <rect x="320" y="180" width="400" height="155" rx="10" fill="#111c30" stroke="#1e3a5f" stroke-width="1"/>
  <g transform="translate(335, 195)">
    <circle cx="10" cy="10" r="10" fill="url(#cyanPurple)"/>
    <text x="10" y="14" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">A</text>
