    <text x="0" y="38" fill="#cbd5e1" font-family="sans-serif" font-size="12">Here is the 3-way partition optimization in C++:</text>

    <rect x="0" y="48" width="370" height="68" rx="6" fill="#070c16"/>
    <text x="12" y="68" fill="#f43f5e" font-family="Courier, monospace" font-size="11">void <tspan fill="#38bdf8">partition3Way</tspan><tspan fill="#cbd5e1">(vector&lt;int&gt;&amp; arr, int l, int r)</tspan></text>
    <text x="12" y="86" fill="#94a3b8" font-family="Courier, monospace" font-size="11">  int lt = l, gt = r, pivot = arr[l];</text>
    <text x="12" y="104" fill="#10b981" font-family="Courier, monospace" font-size="11">  // Complexity reduced to O(N) for duplicates!</text>
  </g>

